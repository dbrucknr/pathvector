[package]
name = "pathvector-session"
version = "0.1.0"
description = "BGP session management: FSM, TCP transport, and message codec (OPEN/UPDATE/KEEPALIVE/NOTIFICATION)"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
bytes            = { workspace = true }
futures          = { workspace = true }
metrics          = { workspace = true }
pathvector-sys   = { workspace = true }
pathvector-types = { workspace = true }
socket2          = { workspace = true }
tokio            = { workspace = true, features = ["io-util"] }
tokio-util       = { workspace = true }
tracing          = "0.1"

[dev-dependencies]
criterion = { workspace = true }
metrics-util = "0.19"
proptest  = { workspace = true }
tokio     = { version = "1", features = ["net", "io-util", "time", "sync", "rt-multi-thread", "macros", "test-util"] }
tracing-subscriber = "0.3"

[[bench]]
name    = "codec"
harness = false

[lints]
workspace = true
