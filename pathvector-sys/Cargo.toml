[package]
name = "pathvector-sys"
version = "0.1.0"
description = "Safe wrappers over OS-level socket APIs used by pathvector (TCP_MD5SIG, etc.)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
libc     = { workspace = true }
smallvec = { workspace = true }
tokio    = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Paused virtual time for the supervisor's backoff tests; io-util for
# tests/tcp_md5_loopback.rs.
tokio    = { workspace = true, features = ["io-util", "test-util"] }

# This crate's sole purpose is to encapsulate unsafe OS-level syscalls and
# expose a safe public API. It deliberately does NOT inherit the workspace
# `unsafe_code = "forbid"` lint — that rule applies to all other pathvector
# crates, which call this crate's safe functions without writing any unsafe
# themselves.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints added in Rust 1.99 that fire on idiomatic code:
#  - assert_is_empty: `assert_eq!(x, [])` often needs a type-annotated cast
#    (e.g. `[] as [(Ipv4Addr, u8); 0]`) to compile, which is worse than
#    `assert!(x.is_empty())`.
#  - unused_async_trait_impl: test mocks and platform stubs must keep
#    `async fn` to match the trait signature.
assert_is_empty          = "allow"
unused_async_trait_impl  = "allow"

[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink            = "0.21"
netlink-packet-route = "0.30"
netlink-packet-core  = "0.8"
futures              = { workspace = true }
